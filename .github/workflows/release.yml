name: Release

# Push a tag like v1.0.0 to test, build and publish the Android APKs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Test shared package
        working-directory: packages/factviz_core
        run: dart test

      - name: Test server
        working-directory: server
        run: dart test

      - name: Test app
        working-directory: app
        run: flutter test

      # Optional: sign with your upload key. Add these repository secrets
      # (Settings → Secrets and variables → Actions): ANDROID_KEYSTORE_BASE64
      # (base64 of the .jks file), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
      # ANDROID_KEY_PASSWORD. Without them the APK is signed with a throwaway
      # debug key, so a later release won't install over an earlier one.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Build APKs
        working-directory: app
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/factviz-${GITHUB_REF_NAME}-universal.apk"
          flutter build apk --release --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "$RUNNER_TEMP/factviz-${GITHUB_REF_NAME}-$abi.apk"
          done

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Explain It Visually ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/factviz-${{ github.ref_name }}-universal.apk
            ${{ runner.temp }}/factviz-${{ github.ref_name }}-arm64-v8a.apk
            ${{ runner.temp }}/factviz-${{ github.ref_name }}-armeabi-v7a.apk
            ${{ runner.temp }}/factviz-${{ github.ref_name }}-x86_64.apk
