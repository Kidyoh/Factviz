name: factviz
description: "Explain It Visually — type any concept, get an animated visualization."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  factviz_core:
    path: ../packages/factviz_core
  factviz_server:
    path: ../server
  flutter_secure_storage: ^11.2.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  http: ^1.6.0
  share_plus: ^13.3.1
  webview_flutter: ^4.14.1
  lottie: ^3.6.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/viz/
    - assets/viz/vendor/
    - assets/viz/img/
    - assets/fonts/
    - assets/lottie/
    - assets/library/
  fonts:
    - family: SourceSerif
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-RegularItalic.ttf
          style: italic
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
    - family: LibreFranklin
      fonts:
        - asset: assets/fonts/LibreFranklin-Regular.ttf
        - asset: assets/fonts/LibreFranklin-Medium.ttf
          weight: 500
        - asset: assets/fonts/LibreFranklin-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/LibreFranklin-Bold.ttf
          weight: 700
